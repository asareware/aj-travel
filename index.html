<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Travel Log</title>
<meta name="description" content="Itineraries as they were planned, photographs as they came back.">

<meta property="og:type" content="website">
<meta property="og:title" content="Travel Log">
<meta property="og:description" content="Itineraries as they were planned, photographs as they came back.">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#f5f7f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1317" media="(prefers-color-scheme: dark)">

<script>
/* Runs before first paint so a saved theme never flashes the wrong way.
   The topbar control in assets/app.js writes the same key. */
(function () {
  try {
    var saved = localStorage.getItem('travellog-theme');
    if (saved === 'light' || saved === 'dark') {
      document.documentElement.setAttribute('data-theme', saved);
    }
  } catch (e) {}
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Lato:wght@400;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<div class="page">
  <div class="shell">

    <header class="topbar">
      <a class="topbar-home" href="#/">Travel log</a>
      <div class="topbar-end">
        <button type="button" id="theme-toggle" class="theme-toggle" data-state="auto"
                aria-label="Colour theme: auto. Activate to change.">
          <svg class="theme-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <circle class="ti-ring" cx="8" cy="8" r="5.3"/>
            <path class="ti-fill ti-half" d="M8 2.7a5.3 5.3 0 0 1 0 10.6z"/>
            <circle class="ti-fill ti-full" cx="8" cy="8" r="5.3"/>
          </svg>
          <span class="theme-label">Auto</span>
        </button>
        <div>2026</div>
      </div>
    </header>

    <main id="view">
      <noscript>
        <div class="noscript">
          <h1>Travel Log</h1>
          <p>This travel log needs JavaScript switched on to show the itineraries and photographs.</p>
        </div>
      </noscript>
    </main>

  </div>

  <div id="lightbox"></div>
</div>

<script src="data/trips.js"></script>
<script src="assets/app.js"></script>
</body>
</html>

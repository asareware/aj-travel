<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Travel Log</title>
<meta name="description" content="Itineraries as they were planned, photographs as they came back.">

<meta property="og:type" content="website">
<meta property="og:title" content="Travel Log">
<meta property="og:description" content="Itineraries as they were planned, photographs as they came back.">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#f5f7f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1317" media="(prefers-color-scheme: dark)">

<script>
/* Runs before first paint so a saved theme never flashes the wrong way.
   The topbar control in assets/app.js writes the same key. */
(function () {
  try {
    var saved = localStorage.getItem('travellog-theme');
    if (saved === 'light' || saved === 'dark') {
      document.documentElement.setAttribute('data-theme', saved);
    }
  } catch (e) {}
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Lato:wght@400;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<div class="page">
  <div class="shell">

    <header class="topbar">
      <a class="topbar-home" href="#/">Travel log</a>
      <div>2026</div>
    </header>

    <main id="view">
      <noscript>
        <div class="noscript">
          <h1>Travel Log</h1>
          <p>This travel log needs JavaScript switched on to show the itineraries and photographs.</p>
        </div>
      </noscript>
    </main>

    <div class="theme-bar">
      <span>Theme</span>
      <div class="theme-buttons">
        <button type="button" id="theme-light" class="theme-btn"
                aria-pressed="false" aria-label="Light theme" title="Light">
          <svg class="theme-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
        </button>
        <button type="button" id="theme-dark" class="theme-btn"
                aria-pressed="false" aria-label="Dark theme" title="Dark">
          <svg class="theme-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
      </div>
      <span id="theme-note">Following your system</span>
    </div>

  </div>

  <div id="lightbox"></div>
</div>

<script src="data/trips.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
